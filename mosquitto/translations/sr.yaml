---
configuration:
  logins:
    name: Кориснички налози
    description: >-
      Листа локалних корисника који ће бити креирани са корисничким именом и лозинком.
      Ово не морате да подешавате јер можете користити и Home Assistant кориснике
      без икакве додатне конфигурације. Такође можете навести
      `password_pre_hashed: true` да бисте користили унапред хеширану лозинку из
      излаза команде `pw` (која је доступна унутар контејнера).
  log_dest:
    name: Одредишта евиденције
    description: >-
      Опциона листа одредишта за Mosquitto евиденцију. Дозвољене вредности су `none`,
      `stdout`, `stderr` и `topic`. Ако је празно, подразумевано је `stdout`.
  log_type:
    name: Типови евиденције (Log Types)
    description: >-
      Опциона листа типова Mosquitto евиденције. Ако је празно, подразумевано су `error`,
      `warning`, `notice` и `information`. Занемарује се и поставља на `all`
      када је укључена опција Debug.
  require_certificate:
    name: Захтевај клијентски сертификат
    description: >-
      Ако је укључено, клијент ће морати да приложи сопствени сертификат поред
      корисничког имена и лозинке. Опција 'cafile' мора бити подешена.
  certfile:
    name: Датотека сертификата
    description: >-
      Датотека која садржи сертификат, укључујући његов ланац. Поставите ову датотеку у
      Home Assistant фасциклу `ssl`.
  cafile:
    name: CA датотека
    description: >-
      Датотека која садржи коренски сертификат којим је потписан клијентски сертификат
      (користи се само ако је укључено 'require_certificate'). Поставите ову датотеку у Home
      Assistant фасциклу `ssl`.
  keyfile:
    name: Датотека приватног кључа
    description: >-
      Датотека која садржи приватни кључ. Поставите ову датотеку у Home Assistant
      фасциклу `ssl`.
  customize:
    name: Прилагођавање
    description: >-
      Погледајте картицу Документација за више информација о овим опцијама.
  debug:
    name: Отклањање грешака
    description: >-
      Ако је укључено, покреће евиденцију за отклањање грешака за mosquitto и додатак за аутентификацију.
network:
  1883/tcp: Обичан MQTT
  1884/tcp: MQTT преко WebSocket-а
  8883/tcp: Обичан MQTT са SSL-ом
  8884/tcp: MQTT преко WebSocket-а са SSL-ом
